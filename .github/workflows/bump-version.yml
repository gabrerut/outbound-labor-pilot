name: Auto-bump userscript version

# Every push to main that changes the script auto-increments the @version patch
# number and commits it back. Tampermonkey checks @updateURL, sees the higher
# version, and pulls the new file for everyone who installed it.

on:
  push:
    branches: [main]
    paths:
      - "outbound-labor-pilot.user.js"

# Allow the workflow to push the bump commit back to the repo.
permissions:
  contents: write

# Prevent the bump commit from triggering another run (loop guard is also the
# [skip ci] tag on the commit message below).
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # Skip runs triggered by the bot's own bump commit.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump @version patch number
        id: bump
        run: |
          FILE="outbound-labor-pilot.user.js"

          # Read current version from the @version meta line.
          CURRENT=$(grep -m1 -oP '@version\s+\K[0-9]+(\.[0-9]+)*' "$FILE")
          if [ -z "$CURRENT" ]; then
            echo "Could not find @version in $FILE" >&2
            exit 1
          fi
          echo "Current version: $CURRENT"

          # Split into fields and increment the LAST field (patch).
          IFS='.' read -r -a PARTS <<< "$CURRENT"
          LAST_IDX=$(( ${#PARTS[@]} - 1 ))
          PARTS[$LAST_IDX]=$(( ${PARTS[$LAST_IDX]} + 1 ))
          NEW=$(IFS='.'; echo "${PARTS[*]}")
          echo "New version: $NEW"

          # Replace only the @version line.
          sed -i -E "s|(@version\s+).*|\1$NEW|" "$FILE"

          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and push bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outbound-labor-pilot.user.js
          if git diff --cached --quiet; then
            echo "No version change to commit."
            exit 0
          fi
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push
