name: Auto-bump userscript version

# Every push to main that changes a userscript auto-increments that script's
# @version patch number and commits it back. Tampermonkey checks @updateURL,
# sees the higher version, and pulls the new file for everyone who installed it.

on:
  push:
    branches: [main]
    paths:
      - "outbound-labor-pilot.user.js"
      - "engage-coaching-tracker.user.js"

# Allow the workflow to push the bump commit back to the repo.
permissions:
  contents: write

# Prevent the bump commit from triggering another run (loop guard is also the
# [skip ci] tag on the commit message below).
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # Skip runs triggered by the bot's own bump commit.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump @version patch number of changed scripts
        id: bump
        run: |
          SCRIPTS="outbound-labor-pilot.user.js engage-coaching-tracker.user.js"
          BEFORE="${{ github.event.before }}"

          # Files changed in this push (fall back to "all scripts" on a new branch).
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED="$SCRIPTS"
          else
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          fi

          SUMMARY=""
          for FILE in $SCRIPTS; do
            [ -f "$FILE" ] || continue
            echo "$CHANGED" | grep -qx "$FILE" || continue

            CURRENT=$(grep -m1 -oP '@version\s+\K[0-9]+(\.[0-9]+)*' "$FILE")
            if [ -z "$CURRENT" ]; then
              echo "Could not find @version in $FILE" >&2
              exit 1
            fi

            # Increment the LAST field (patch).
            IFS='.' read -r -a PARTS <<< "$CURRENT"
            LAST_IDX=$(( ${#PARTS[@]} - 1 ))
            PARTS[$LAST_IDX]=$(( ${PARTS[$LAST_IDX]} + 1 ))
            NEW=$(IFS='.'; echo "${PARTS[*]}")
            echo "$FILE: $CURRENT -> $NEW"

            # Replace only the first @version meta line.
            sed -i -E "0,/(\/\/ @version\s+).*/s//\1$NEW/" "$FILE"
            git add "$FILE"
            SUMMARY="$SUMMARY ${FILE%%.user.js} $NEW"
          done

          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Commit and push bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No version change to commit."
            exit 0
          fi
          git commit -m "chore: bump version${{ steps.bump.outputs.summary }} [skip ci]"
          git push
